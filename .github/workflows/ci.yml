# Every push and pull request: quick checks, no native build – tests,
# TypeScript, the JavaScript bundle for iOS and Android, and the generated
# native projects (all config plugins). Builds run only by hand on the own
# Mac (build.yml, release.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests and TypeScript
        run: npm run check
      - name: JavaScript bundle (iOS and Android)
        run: npx expo export --platform ios --platform android --output-dir dist
      - name: Native projects (expo prebuild)
        run: npx expo prebuild --clean --no-install
