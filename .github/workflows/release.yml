# A release at the push of a button: Actions → Release → Run workflow.
# Raises the version in package.json (and with it the native projects, see
# scripts/version.mjs), tags v1.2.3, builds iOS and Android and attaches the
# builds to a GitHub release. With the store secrets (README → Signing) the
# builds are signed and – if "upload" is on – go to TestFlight and Play's
# internal testing track. Without secrets they stay unsigned and are only
# attached. After a failed build, "rebuild" with the version (e.g. 1.0.1)
# builds it again with the next build number, without raising the version.
name: Release
run-name: "Release · ${{ inputs.rebuild != '' && format('rebuild {0}', inputs.rebuild) || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      rebuild:
        description: "Only to build an existing version again: its number, e.g. 1.0.1 (leave empty for a new release)"
        type: string
        default: ""
      build:
        description: "Build number within the version (0–99); raise it for every rebuild that goes to the stores"
        type: string
        default: "0"
      upload:
        description: "Upload signed builds to TestFlight and Play internal testing (needs the secrets)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # Own runner (label self-hosted) for this repository's own work.
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository))) && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: version
        env:
          REBUILD: ${{ inputs.rebuild }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REBUILD" ]; then
            version="$(printf '%s' "$REBUILD" | tr -d '[:space:]' | sed -E 's/^[vV]//')"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::rebuild needs a version like 1.0.1 (got '$REBUILD')"
              exit 1
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::There is no tag v$version to build again."
              exit 1
            fi
            gh release view "v$version" > /dev/null 2>&1 || gh release create "v$version" --draft --generate-notes --title "Flowplan Mobile $version"
          else
            # npm version runs scripts/version.mjs, which updates the native projects.
            npm version "$BUMP" --no-git-tag-version
            version="$(node -p 'require("./package.json").version')"
            git add package.json package-lock.json ios/App/App.xcodeproj/project.pbxproj android/app/build.gradle
            git commit -m "Release v$version"
            git tag "v$version"
            git push origin main "v$version"
            gh release create "v$version" --draft --generate-notes --title "Flowplan Mobile $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ios:
    needs: version
    # iOS needs macOS and Xcode: GitHub's runner.
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FLOWPLAN_BUILD: ${{ inputs.build }}
      SIGNED: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' && vars.IOS_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version and build number
        run: node scripts/version.mjs
      - run: npx cap sync ios
      - uses: ruby/setup-ruby@v1
        if: env.SIGNED == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Signed build (and TestFlight)
        if: env.SIGNED == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_DISTRIBUTION_CERTIFICATE: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: bundle exec fastlane ios ${{ inputs.upload && 'beta' || 'build' }}
      - name: Unsigned build
        if: env.SIGNED != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath ios/build/Flowplan.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive | tail -n 20
          # An .ipa without a signature: for inspection or re-signing, not for devices.
          mkdir -p ios/build/Payload
          cp -R ios/build/Flowplan.xcarchive/Products/Applications/App.app ios/build/Payload/
          (cd ios/build && zip -qry Flowplan.ipa Payload)
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build/sim CODE_SIGNING_ALLOWED=NO build | tail -n 5
          (cd ios/build/sim/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/ios/build/Flowplan-simulator.zip" App.app)
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          suffix=$([ "$SIGNED" = true ] && echo "" || echo "-unsigned")
          cp ios/build/Flowplan.ipa "Flowplan-$VERSION-ios$suffix.ipa"
          files=("Flowplan-$VERSION-ios$suffix.ipa")
          if [ -f ios/build/Flowplan-simulator.zip ]; then
            cp ios/build/Flowplan-simulator.zip "Flowplan-$VERSION-ios-simulator.zip"
            files+=("Flowplan-$VERSION-ios-simulator.zip")
          fi
          gh release upload "v$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

  android:
    needs: version
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository))) && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      FLOWPLAN_BUILD: ${{ inputs.build }}
      SIGNED: ${{ secrets.ANDROID_KEYSTORE != '' }}
      UPLOAD: ${{ inputs.upload && secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ needs.version.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v4
      - run: npm ci
      - name: Version and build number
        run: node scripts/version.mjs
      - run: npx cap sync android
      - uses: ruby/setup-ruby@v1
        if: env.SIGNED == 'true'
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Signed bundle (and Play internal testing)
        if: env.SIGNED == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane android ${{ env.UPLOAD == 'true' && 'internal' || 'build' }}
      - name: APKs (signed with the same key if there is one)
        working-directory: android
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$SIGNED" = true ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          fi
          ./gradlew --no-daemon assembleRelease bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=android/app/build/outputs
          if [ "$SIGNED" = true ]; then
            cp $out/apk/release/app-release.apk "Flowplan-$VERSION-android.apk"
            cp $out/bundle/release/app-release.aab "Flowplan-$VERSION-android.aab"
          else
            cp $out/apk/release/app-release-unsigned.apk "Flowplan-$VERSION-android-unsigned.apk"
            cp $out/bundle/release/app-release.aab "Flowplan-$VERSION-android-unsigned.aab"
          fi
          gh release upload "v$VERSION" Flowplan-$VERSION-android*.ap* Flowplan-$VERSION-android*.aab --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    needs: [version, ios, android]
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository))) && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
