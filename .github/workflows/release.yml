# A release at the push of a button: Actions → Release → Run workflow.
# Raises the version in package.json (app.config.ts takes it from there),
# tags v1.2.3, builds iOS and Android on the own Mac (build.yml) and attaches
# the builds to a GitHub release. With the store secrets (README → Signing)
# the builds are signed and – if "upload" is on – go to TestFlight and Play's
# internal testing track. After a failed build, "rebuild" with the version
# (e.g. 1.0.1) builds it again with the next build number, without raising
# the version.
name: Release
run-name: "Release · ${{ inputs.rebuild != '' && format('rebuild {0}', inputs.rebuild) || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      rebuild:
        description: "Only to build an existing version again: its number, e.g. 1.0.1 (leave empty for a new release)"
        type: string
        default: ""
      build:
        description: "Build number within the version (0–99); raise it for every rebuild that goes to the stores"
        type: string
        default: "0"
      upload:
        description: "Upload signed builds to TestFlight and Play internal testing (needs the secrets)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: [self-hosted, macOS]
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: version
        env:
          REBUILD: ${{ inputs.rebuild }}
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$REBUILD" ]; then
            version="$(printf '%s' "$REBUILD" | tr -d '[:space:]' | sed -E 's/^[vV]//')"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::rebuild needs a version like 1.0.1 (got '$REBUILD')"
              exit 1
            fi
            if ! git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
              echo "::error::There is no tag v$version to build again."
              exit 1
            fi
            gh release view "v$version" > /dev/null 2>&1 || gh release create "v$version" --draft --generate-notes --title "Flowplan Mobile $version"
          else
            npm version "$BUMP" --no-git-tag-version
            version="$(node -p 'require("./package.json").version')"
            git add package.json package-lock.json
            git commit -m "Release v$version"
            git tag "v$version"
            git push origin main "v$version"
            gh release create "v$version" --draft --generate-notes --title "Flowplan Mobile $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      platform: both
      build: ${{ inputs.build }}
      upload: ${{ inputs.upload }}
      ref: refs/tags/v${{ needs.version.outputs.version }}
      release: ${{ needs.version.outputs.version }}

  publish:
    needs: [version, build]
    runs-on: [self-hosted, macOS]
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.version.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
