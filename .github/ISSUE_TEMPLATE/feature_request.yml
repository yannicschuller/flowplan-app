name: Feature request
description: Suggest an idea for the iPhone, iPad or Android app
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas for Flowplan itself (editor, databases, whiteboards …) belong in the [main Flowplan repository](https://github.com/yannicschuller/flowplan/issues/new/choose). Here: what only the native app can do – widgets, sharing, notifications, offline, camera, system integration.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/yannicschuller/flowplan-app/issues?q=is%3Aissue) (open and closed).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the problem or the use case first.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Your idea
      description: How could the app solve it? Mockups and examples from other apps are welcome.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - iPhone
        - iPad
        - Android
  - type: textarea
    id: context
    attributes:
      label: Anything else?
