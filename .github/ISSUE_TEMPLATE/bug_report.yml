name: Bug report
description: Something in the iPhone, iPad or Android app does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! This repository is for the **native app** (iPhone, iPad, Android).
        If the problem also happens in the browser, please report it in the [main Flowplan repository](https://github.com/yannicschuller/flowplan/issues/new/choose) instead.
  - type: checkboxes
    id: searched
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/yannicschuller/flowplan-app/issues?q=is%3Aissue) (open and closed) and this has not been reported yet.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app and sign in
        2. Share a photo from the Photos app to Flowplan
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device
      options:
        - iPhone
        - iPad
        - Android phone
        - Android tablet
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model and system version
      placeholder: "iPhone 15, iOS 26.1 · Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: "At the bottom of the app's **Settings** screen, e.g. 1.0.9 (42)."
      placeholder: "1.0.9 (42)"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - App Store
        - TestFlight
        - APK from flowplan.org
        - Development build
  - type: input
    id: server-version
    attributes:
      label: Server
      description: "The Flowplan server the app is connected to: \"flowplan.org\", or for a self-hosted server its version (in the web app under **Settings → About Flowplan**)."
      placeholder: "flowplan.org · self-hosted 0.9.0"
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag images or screen recordings in here.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Crash reports or logs, if you have them – please remove anything private.
      render: text
