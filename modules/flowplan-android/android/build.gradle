plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.flowplan'
version = '1.0.0'

android {
  namespace "app.flowplan.androidshell"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // OnBackPressedCallback with the gesture's progress (BackEventCompat, 1.8+).
  implementation 'androidx.activity:activity:1.9.3'
}
