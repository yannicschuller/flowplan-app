plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.flowplan'
version = '1.0.0'

android {
  namespace "app.flowplan.capture"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // Google Play services: whether it is there (GoogleApiAvailability).
  implementation 'com.google.android.gms:play-services-base:18.5.0'
  // ML Kit's document scanner: camera, edges, perspective and clean-up run in Google Play
  // services (its UI and model are downloaded there on first use), so the app needs no CAMERA
  // permission for it and its APK grows by a few hundred KB only.
  implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1'
  // ML Kit's text recognition v2 (Latin script) from Google Play services, not the bundled model
  // (com.google.mlkit:text-recognition, about 4 MB per ABI): the scanner needs Play services
  // anyway, and the model comes with them (AndroidManifest.xml asks for it at install).
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
