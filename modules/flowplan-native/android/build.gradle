plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.flowplan'
version = '1.0.0'

android {
  namespace "app.flowplan.nativeshell"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.16.0'
  // React Native's networking (NetworkingModule, OkHttp) for the pinned certificates
  // (CertificatePins.kt).
  implementation 'com.facebook.react:react-android'
}
